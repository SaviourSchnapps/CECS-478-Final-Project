name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzer
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: analyzer/requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: |
          pytest --cov=analyzer \
                 --cov-report=term \
                 --cov-report=xml:coverage.xml \
                 --junitxml=junit.xml \
                 tests/

      - name: Generate coverage badge
        run: |
          pip install setuptools
          coverage-badge -o coverage.svg -f
          PCT=$(python -c "import xml.etree.ElementTree as ET; r=ET.parse('coverage.xml').getroot(); print(round(float(r.attrib['line-rate'])*100,1))")
          echo "## Coverage: $PCT%" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            analyzer/coverage.xml
            analyzer/coverage.svg
            analyzer/junit.xml
